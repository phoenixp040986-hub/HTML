<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    .Feedback {
        margin-left: 4px;
        margin-top: 8px;
        border: smooth;
        padding: 80px 50px;
        width: 1212px;
        background: rgb(236, 234, 234);
        font-size: 15px;
    }
    .Address {
        margin-left: 4px;
        margin-top: 4px;
        margin-bottom: 4px;
        border: smooth;
        padding: 80px 50px;
        width: 1212px;
        background: #f1f1f1;
        font-size: 15px;
    }
    .amount {
        padding: 100px auto;
        margin: 5px 150px 5px;
        text-align: center;
        width: 100px;
    }
    .detail {
        width: 1212px;
        padding: 100px auto;
        margin: 5px auto;
    }
</style>
</head>
<body>
    <h1 style="text-align: center; background: red; color: white;">
        Gift Certificate
    </h2>
    <br>
    <p style="font-size: 30px; margin-top: 5px; margin-bottom: 5px;">
        Choose your gift amount:
    </p>
    <button class="amount">$25</button>
    <button class="amount">$50</button>
    <button class="amount">$100</button>
    <button class="amount">$150</button>
    <button class="amount">$200</button>
    <button class="amount">$250</button>
    <br>
    <input  type="text" placeholder="Thank You!" class="Feedback">
    <p style="font-size: 15px; margin-top: 4px;">Leave a comment or good wishes</p>
    <h2 style="margin-bottom: 4px; ">From:</h2>
    <input placeholder="Jane Parker" type="text" class="detail">
    <p style="font-size: 15px; margin-top: 4px;">Full Name</p>
    <input placeholder="jparker@domain.com" type="email" class="detail">
    <p style="font-size: 15px; margin-top: 4px;">Email</p>
    <h2 style="margin-bottom: 4px;">To:</h2>
    <input placeholder="Jhon Parker" type="text" class="detail">
    <p style="font-size: 15px; margin-top: 4px; margin-bottom: 4px;">
        Recipient Name
    </p>
    <input placeholder="jhonparker@domain.com" type="text" class="detail">
    <p style="font-size: 15px; margin-top: 4px; margin-bottom: 4px;">
        Recipient Email
    </p>
    <br>
    <input placeholder="1012 Glenn Street, Crofton, Kentucky, 42217" class="Address">
</body>
