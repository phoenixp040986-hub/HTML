<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(139, 204, 226);
        }
        #box {
            margin: 150px auto;
            width: 500px;
            align-items: center;
            text-align: center;
            background-color: white;
            box-shadow: 5px 5px 10px gray;
            border-radius: 15px;
        }
        #main-header {
            text-align: center;
            font-family: "Gill Sans Extrabold", sans-serif;
            font-size: 30px;
            margin: auto;
            
        }
        .required {
            font-size: 14px;
            font-family: monospace;
            color: black;
            text-align: center;
            margin: auto;
        }
        .details {
            padding: 10px;
            margin: auto;
            margin-top: 10px;
            background-color: blue;
            text-align: center;
            border: none;
            border-radius: 40px;
        }
        .v1 {
           text-align: center;
           padding: 5px;
           margin: auto;
           margin-top: 10px;
           border: smooth;
        }
        .v2 {
            text-align: center;
            padding: 1px;
            margin: auto;
            margin-top: 10px;
            border: none;
        }
    </style>
</head>
<body>
<div id="box">
    <h1 id="main-header">Login</h1>
    <br>
    <b class="required">Email</b>
    <br>
    <input type="text" class="details">
    <br>
    <b class="required">Password</b>
    <br>
    <input type="text" class="details">
    <br>
    <button type="submit" value="signin" class="v1">Login</button>
    <br>
    <button type="click" value="Login" class="v2"><u>Don't have an account?</u></button>
</div>
</body>
